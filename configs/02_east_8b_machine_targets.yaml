# east_8b_machine_targets — DEFERRED 2026-09-01. See LOG.md.
#
# ORIGINAL DESIGN (deferred): EAST-8B backbone, CURATED sources, targets
# re-generated by EAST-8B (machine-translated). Aimed to isolate target
# quality (human vs machine) with source pool held constant vs config 01.
#
# WHY DEFERRED: the "same sources, swap targets only" ablation was a mis-
# read of Wang 2024 + a pre-feasibility-check design pivot. User confirmed
# on 2026-09-01 the target-quality axis isn't the paper's headline story.
#
# SUCCESSOR: `EAST↺east(ot)` — a fresh config (placeholder `09_east_east_
# ot.yaml`, not yet written) that sub-samples Multi-90K to N-matched-per-
# direction (4 dirs: en↔{de, ru}) and rechunks it with OT. Compares
# against the released `biaofu-xmu/EAST-8B` on identical source+target
# material — isolates chunking-algorithm quality (OT vs GPT-4 semantic
# chunks) as a single-variable ablation.
#
# DO NOT RUN: `bin/run` on this config will attempt to build a
# source_pool with retranslated targets — the retranslate step
# (`scripts/01b_retranslate_targets.py`) was never implemented and this
# whole recipe is superseded.

tag: east_8b_machine_targets

backbone:
  hf_id: biaofu-xmu/EAST-8B
  local_path: ${SIMT_MODEL_BASE}/EAST-8B
  is_instruct: true
  tokenizer_dir: ${SIMT_MODEL_BASE}/EAST-8B

source_pool:
  corpus: curated                              # SAME sources as 01_east_8b_curated
  directions:
    en-de: 10000
    de-en: 10000
    en-ru: 10000
    ru-en: 10000
    en-ar: 10000
    ar-en: 10000
    en-vi: 10000
    vi-en: 10000
  human_target_only: true                      # keep the curated pool; ONLY the
                                                # target column gets rewritten
                                                # by the retranslate step below
  target_source: backbone_retranslated         # NEW field — signals to Stage 1
                                                # to invoke scripts/01b_retranslate_targets.py
  target_generator: ${SIMT_MODEL_BASE}/EAST-8B # which model to decode with

annotate:
  annotator: same_as_backbone                  # EAST-8B annotates the (source, machine-target) pairs
  criterion: ot
  tau: 0.30
  top_k: 128
  lookahead_k: 0
  latency_bins: [low, medium, high]

sft_dataset:
  merge_small_chunks: true
  min_src_words: 4
  keep_collapsed_rows: false

train:
  num_epochs: 2
  per_device_batch_size: 2
  grad_accum_steps: 8
  learning_rate: 1.0e-5
  warmup_steps: 200
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false

eval:
  test_sets:
    wmt15:   [de-en]
    wmt22:   [de-en, en-de, ru-en, en-ru]
    iwslt17: [de-en, en-de, ar-en, en-ar]
    iwslt15: [vi-en, en-vi]
  latencies: [low, medium, high]
  n_sentences: -1
  policy: check_argmax
  mode: streaming

plot:
  color: "#e67e22"
  marker: v
  label: EAST↺machine-tgt
