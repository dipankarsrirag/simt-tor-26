# east_8b_machine_targets — EAST-8B backbone, CURATED sources (same as
# 00_gemma_2b_curated / 01_east_8b_curated), but TARGETS re-generated by
# EAST-8B itself (machine-translated). Chunking = OT via backbone.
#
# Fig 1 line 6 and Fig 2 line 3 in docs/followup-experiments.md. This is
# the corrected Q1b resolution: isolate TARGET QUALITY (human vs machine)
# with source pool, annotator, and policy all held constant vs 01.
#
# Pipeline delta vs 01_east_8b_curated: after Stage 1 builds the curated
# source pool, an extra preprocessing pass runs EAST-8B on every source
# sentence to produce a machine-translated target. That pair (curated
# source + EAST-8B target) then flows through Stages 2–6 unchanged.
#
# STATUS: preprocessing step not yet implemented. Needed:
#   scripts/01b_retranslate_targets.py
#     input:  results/sft_dataset/{tag}/source_pool.json (from Stage 1)
#     output: same, with `target` field replaced by EAST-8B decode of `source`
#     invokes: {SIMT_MODEL_BASE}/EAST-8B in bf16, greedy decode, batched.
#
# Run (once impl exists):
#   bin/run configs/02_east_8b_machine_targets.yaml --ngpus 1
# (runner will need to know to insert the retranslate step between 1 and 2)

tag: east_8b_machine_targets

backbone:
  hf_id: biaofu-xmu/EAST-8B
  local_path: ${SIMT_MODEL_BASE}/EAST-8B
  is_instruct: true
  tokenizer_dir: ${SIMT_MODEL_BASE}/EAST-8B

source_pool:
  corpus: curated                              # SAME sources as 01_east_8b_curated
  directions:
    en-de: 30000
    de-en: 30000
    en-ru: 30000
    ru-en: 30000
    en-ar: 30000
    ar-en: 30000
    en-vi: 30000
    vi-en: 30000
  human_target_only: true                      # keep the curated pool; ONLY the
                                                # target column gets rewritten
                                                # by the retranslate step below
  target_source: backbone_retranslated         # NEW field — signals to Stage 1
                                                # to invoke scripts/01b_retranslate_targets.py
  target_generator: ${SIMT_MODEL_BASE}/EAST-8B # which model to decode with

annotate:
  annotator: same_as_backbone                  # EAST-8B annotates the (source, machine-target) pairs
  criterion: ot
  tau: 0.30
  top_k: 128
  lookahead_k: 0
  latency_bins: [low, medium, high]

sft_dataset:
  merge_small_chunks: true
  min_src_words: 4
  keep_collapsed_rows: false

train:
  num_epochs: 2
  per_device_batch_size: 2
  grad_accum_steps: 8
  learning_rate: 1.0e-5
  warmup_steps: 200
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false

eval:
  test_sets:
    wmt15:   [de-en]
    wmt22:   [de-en, en-de, ru-en, en-ru]
    iwslt17: [de-en, en-de, ar-en, en-ar]
    iwslt15: [vi-en, en-vi]
  latencies: [low, medium, high]
  n_sentences: -1
  policy: check_argmax
  mode: streaming

plot:
  color: "#e67e22"
  marker: v
  label: EAST↺machine-tgt
