# v6b_gemma_2b — the shipped baseline. Gemma-4-E2B-it self-annotates the
# curated corpus with OT, then SFTs on it. The 171 landed eval cells in
# _archive/results/v6b_gemma_2b/extrinsic/ came from this recipe.
#
# Rerun with: bin/run configs/v6b_gemma_2b.yaml --ngpus 1

tag: v6b_gemma_2b

backbone:
  hf_id: google/gemma-4-E2B-it
  local_path: ${SIMT_MODEL_BASE}/gemma-4-E2B-it
  is_instruct: true
  tokenizer_dir: ${SIMT_REPO_ROOT}/_archive/results/v6b_gemma_2b/tokenizer-extended-v6

source_pool:
  corpus: curated
  directions:
    en-de: 10000
    de-en: 10000
    en-ru: 10000
    ru-en: 10000
    en-ar: 10000
    ar-en: 10000
    en-vi: 10000
    vi-en: 10000
  human_target_only: true

annotate:
  annotator: same_as_backbone
  criterion: ot
  tau: 0.30
  top_k: 128
  lookahead_k: 0
  latency_bins: [low, low-medium, medium, medium-high, high]

sft_dataset:
  merge_small_chunks: true
  min_src_words: 4
  keep_collapsed_rows: false

train:
  num_epochs: 2
  per_device_batch_size: 4
  grad_accum_steps: 4
  learning_rate: 2.0e-5
  warmup_steps: 100
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false

eval:
  test_sets:
    wmt15: [de-en]
    wmt22: [de-en, en-de, ru-en, en-ru]
    iwslt17: [de-en, en-de, ar-en, en-ar]
    iwslt15: [vi-en, en-vi]
  latencies: [low, low-medium, medium, medium-high, high]
  n_sentences: -1                   # -1 = full test set; override per-run with CLI
  policy: check_argmax
  mode: streaming


plot:
  x_label: AL
  y_label: SacreBLEU
  y_ticks_every: 4
  x_ticks_every: 2
  color: "#7d3c98"
  marker: s
  label: Ours (Gemma-2B)
