# gemma_4b_curated — Gemma-4-E4B-it backbone, curated corpus, self-annotated.
# Fig 4 middle line in docs/followup-experiments.md — the "does the recipe
# scale?" story: 2B (gemma_2b_curated) → 4B (this) → 8B (east_8b_curated).
#
# Run: bin/run configs/gemma_4b_curated.yaml --ngpus 1

tag: gemma_4b_curated

backbone:
  hf_id: google/gemma-4-E4B-it
  local_path: ${SIMT_MODEL_BASE}/gemma-4-E4B-it
  is_instruct: true
  tokenizer_dir: ${SIMT_REPO_ROOT}/results/train/gemma_4b_curated/tokenizer  # built by prepare_tokenizer

source_pool:
  corpus: curated
  directions:
    en-de: 10000
    de-en: 10000
    en-ru: 10000
    ru-en: 10000
    en-ar: 10000
    ar-en: 10000
    en-vi: 10000
    vi-en: 10000
  human_target_only: true

annotate:
  annotator: same_as_backbone                  # self-annotation with Gemma-4B
  criterion: ot
  tau: 0.30
  top_k: 128
  lookahead_k: 0
  latency_bins: [low, low-medium, medium, medium-high, high]

sft_dataset:
  merge_small_chunks: true
  min_src_words: 4
  keep_collapsed_rows: false

train:
  num_epochs: 2
  per_device_batch_size: 2                     # 4B; can push to 4 with bf16 on H100+
  grad_accum_steps: 8
  learning_rate: 1.5e-5
  warmup_steps: 150
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false

eval:
  test_sets:
    wmt15: [de-en]
    wmt22: [de-en, en-de, ru-en, en-ru]
    iwslt17: [de-en, en-de, ar-en, en-ar]
    iwslt15: [vi-en, en-vi]
  latencies: [low, low-medium, medium, medium-high, high]
  n_sentences: -1                   # -1 = full test set; override per-run with CLI
  policy: check_argmax
  mode: streaming


plot:
  color: "#2c6fbb"
  marker: D
  label: Ours (Gemma-4B)
