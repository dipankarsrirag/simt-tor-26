# Example experiment config — copy to configs/{your_tag}.yaml and edit.
#
# Every stage of the pipeline reads its parameters from this file.
# The `tag` field is the namespace for all outputs (results/{stage}/{tag}/,
# logs/{stage}/{tag}/, jobs/{stage}/{tag}_*.pbs).

tag: example_run   # short lowercase-with-underscores; must be filesystem-safe

# ─────────── backbone ───────────
# `${VAR}` placeholders below are expanded from environment vars by
# src/config.load_config(). `SIMT_MODEL_BASE` and `SIMT_REPO_ROOT` are set by
# `bin/_env.sh` (or override via the shell before invoking the pipeline).
# Use `local_path` when the model is on disk, `hf_id` if downloading from HF.
backbone:
  hf_id: google/gemma-4-E2B-it              # HF model id (used if local_path missing)
  local_path: ${SIMT_MODEL_BASE}/gemma-4-E2B-it
  is_instruct: true                          # true → chat template, NL latency
  tokenizer_dir: ${SIMT_REPO_ROOT}/_archive/results/v6b_gemma_2b/tokenizer-extended-v6

# ─────────── source pool ───────────
# (Stage 1 — scripts/01_build_source_pool.py)
source_pool:
  # Which corpus to pull raw parallel data from.
  corpus: curated         # one of: curated (europarl+news-comm+TED2020), east (SiMT-660K+Multi-90K)
  directions:          # per-direction row targets
    en-de: 30000
    de-en: 30000
    en-ru: 30000
    ru-en: 30000
    en-ar: 30000
    ar-en: 30000
    en-vi: 30000
    vi-en: 30000
  # Human-target requirement: drop pairs where target text was machine-generated.
  # Only meaningful for corpus=curated.
  human_target_only: true

# ─────────── annotation ───────────
# (Stage 2 — src/annotator/annotate.py invoked by jobs/annotate/{tag}_*.pbs)
#
# Output is keyed by (annotator model, language pair), NOT by experiment tag:
#   results/annotate/{annotator}/{pair}/matrices.jsonl
# Rationale: multiple downstream SFT experiments (different backbones, different
# policies, different corpora) can reuse the same annotator matrices. Keying by
# tag would force wasteful duplication.
annotate:
  annotator: same_as_backbone       # 'same_as_backbone' | HF id | local path.
                                    # E.g. for Fig 5 cross-annotation experiments,
                                    # set to 'gemma-4-E2B-it' while backbone stays
                                    # at Gemma-4-E4B-it or EAST-8B.
  criterion: ot                     # ot | js | wait-k | conv-simt | gpt4-chunks
  tau: 0.30                         # OT convergence threshold
  top_k: 128                        # sparse support for OT
  lookahead_k: 0                    # 0 = no lookahead; positive = k-token peek
  latency_bins: [low, medium, high] # 3-bin (EAST-style) or 5-bin (low, low-medium, medium, medium-high, high)

# ─────────── SFT dataset ───────────
# (Stage 3 — scripts/03_build_sft_dataset.py)
sft_dataset:
  merge_small_chunks: true          # EAST §3.1 merge rule
  min_src_words: 4                  # merge threshold
  keep_collapsed_rows: false        # drop chunks/sent = 1 rows

# ─────────── training ───────────
# (Stage 4 — src/train/sft.py invoked by jobs/train/{tag}.pbs)
train:
  num_epochs: 2
  per_device_batch_size: 4
  grad_accum_steps: 4               # effective batch = 16
  learning_rate: 2e-5
  warmup_steps: 100
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false       # EAST recipe: loss on source + target + specials

# ─────────── eval ───────────
# (Stage 5 — src/eval/extrinsic.py invoked by jobs/eval/{tag}_*.pbs)
eval:
  test_sets:                        # dataset → [directions]. The loader
                                    # discovers the test-set file at
                                    # ${SIMT_TESTSETS_ROOT}/eval/{src-tgt}/{ds}.{pair}.{src,ref}
                                    # and reads its full length by default.
    wmt15:   [de-en]
    wmt22:   [de-en, en-de, ru-en, en-ru]
    iwslt17: [de-en, en-de, ar-en, en-ar]
    iwslt15: [vi-en, en-vi]
  latencies: [low, medium, high]    # subset of annotate.latency_bins
  n_sentences: -1                   # -1 = full test set. Set positive N
                                    # for a quick sanity subset.
  policy: check_argmax              # check_argmax | wait_k | check_prob_thresh | ...
  mode: streaming

# ─────────── plot ───────────
# (Stage 6 — scripts/04_plot_bleu_al.py)
plot:
  x_label: AL                       # AL | LAAL | AL-CA
  y_label: SacreBLEU                # SacreBLEU | COMET
  y_ticks_every: 4
  x_ticks_every: 2
  color: "#7d3c98"                  # hex; distinct per condition when comparing
  marker: s                         # ^ D s o for CondA CondB Ours EAST-8B
  label: Ours                       # legend label
