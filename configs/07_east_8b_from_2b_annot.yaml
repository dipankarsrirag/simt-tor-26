# east_8b_from_2b_annot — EAST-8B trained on annotations produced by
# Gemma-4-E2B-it. Fig 5 right line in docs/followup-experiments.md.
# Small-annotator, big-backbone: the strongest test of annotation portability.
#
# Skips Stage 2 (reuses results/annotate/gemma-4-E2B-it/* from v6b_gemma_2b).
#
# Run: bin/run configs/east_8b_from_2b_annot.yaml --ngpus 1 --skip 2

tag: east_8b_from_2b_annot

backbone:
  hf_id: biaofu-xmu/EAST-8B
  local_path: ${SIMT_MODEL_BASE}/EAST-8B
  is_instruct: true
  tokenizer_dir: ${SIMT_MODEL_BASE}/EAST-8B

source_pool:
  corpus: curated                              # same source pool as v6b_gemma_2b
  directions:
    en-de: 10000
    de-en: 10000
    en-ru: 10000
    ru-en: 10000
    en-ar: 10000
    ar-en: 10000
    en-vi: 10000
    vi-en: 10000
  human_target_only: true

annotate:
  annotator: gemma-4-E2B-it                    # cross-annotation — reuses v6b_gemma_2b matrices
  criterion: ot
  tau: 0.30
  top_k: 128
  lookahead_k: 0
  latency_bins: [low, low-medium, medium, medium-high, high]

sft_dataset:
  merge_small_chunks: true
  min_src_words: 4
  keep_collapsed_rows: false

train:
  num_epochs: 2
  per_device_batch_size: 2
  grad_accum_steps: 8
  learning_rate: 1.0e-5
  warmup_steps: 200
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false

eval:
  test_sets:
    wmt15:    { de-en: 2169 }
    wmt22:    { de-en: 1979, en-de: 1904, ru-en: 2016, en-ru: 2037 }
    iwslt17:  { de-en: 1138, en-de: 1138, ar-en: 1460, en-ar: 1460 }
    iwslt15:  { vi-en: 1268, en-vi: 1268 }
  latencies: [low, low-medium, medium, medium-high, high]
  policy: check_argmax
  mode: streaming

plot:
  color: "#c0392b"
  marker: s
  label: EAST-8B ← 2B annot
