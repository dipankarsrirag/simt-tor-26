# east_8b_from_2b_annot — Llama-3-8B-Instruct trained on annotations
# produced by Gemma-4-E2B-it. Fig 5 right line in docs/followup-
# experiments.md. Small-annotator, big-backbone: the strongest test of
# annotation portability.
#
# 2026-09-01 backbone switch: was biaofu-xmu/EAST-8B. Now base
# Meta-Llama-3-8B-Instruct so Fig 5 compares two base checkpoints
# (Gemma-4-E4B-it middle, Llama-3-8B-Instruct right) — apples to apples
# with the leftmost Gemma-4-E2B-it (self) line. See LOG.md.
#
# Skips Stage 2 (reuses results/annotate/gemma-4-E2B-it/* from gemma_2b_curated).
#
# Run: bin/run configs/07_east_8b_from_2b_annot.yaml --ngpus 1 --skip 2

tag: east_8b_from_2b_annot

backbone:
  hf_id: meta-llama/Meta-Llama-3-8B-Instruct
  local_path: ${SIMT_MODEL_BASE}/Meta-Llama-3-8B-Instruct
  is_instruct: true                                          # Llama-3 chat template
  tokenizer_dir: ${SIMT_MODEL_BASE}/Meta-Llama-3-8B-Instruct-extended-v6
                                                             # ← built by bin/04_prepare_tokenizer

source_pool:
  corpus: curated                              # same source pool as gemma_2b_curated
  directions:
    en-de: 10000
    de-en: 10000
    en-ru: 10000
    ru-en: 10000
    en-ar: 10000
    ar-en: 10000
    en-vi: 10000
    vi-en: 10000
  human_target_only: true

annotate:
  annotator: gemma-4-E2B-it                    # cross-annotation — reuses gemma_2b_curated matrices
  criterion: ot
  tau: 0.30
  top_k: 128
  lookahead_k: 0
  latency_bins: [low, low-medium, medium, medium-high, high]

sft_dataset:
  merge_small_chunks: true
  min_src_words: 4
  keep_collapsed_rows: false

train:
  num_epochs: 2
  per_device_batch_size: 2
  grad_accum_steps: 8
  learning_rate: 1.0e-5
  warmup_steps: 200
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false

eval:
  test_sets:
    wmt15: [de-en]
    wmt22: [de-en, en-de, ru-en, en-ru]
    iwslt17: [de-en, en-de, ar-en, en-ar]
    iwslt15: [vi-en, en-vi]
  latencies: [low, low-medium, medium, medium-high, high]
  n_sentences: -1                   # -1 = full test set; override per-run with CLI
  policy: check_argmax
  mode: streaming


plot:
  color: "#c0392b"
  marker: s
  label: Llama-3-8B ← 2B annot
