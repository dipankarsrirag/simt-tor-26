# gemma_4b_from_2b_annot — Gemma-4-E4B-it trained on annotations produced by
# Gemma-4-E2B-it. Fig 5 middle line in docs/followup-experiments.md — the
# "is annotation portable?" story.
#
# Skips Stage 2 entirely (reuses existing results/annotate/gemma-4-E2B-it/*
# from the v6b_gemma_2b baseline). Only Stage 3 onward runs.
#
# Run: bin/run configs/gemma_4b_from_2b_annot.yaml --ngpus 1 --skip 2
#      (annotation is already done — Stage 2 skipped explicitly)

tag: gemma_4b_from_2b_annot

backbone:
  hf_id: google/gemma-4-E4B-it
  local_path: ${SIMT_MODEL_BASE}/gemma-4-E4B-it
  is_instruct: true
  tokenizer_dir: ${SIMT_REPO_ROOT}/results/train/gemma_4b_from_2b_annot/tokenizer

source_pool:
  corpus: curated                              # same source pool as v6b_gemma_2b
  directions:
    en-de: 10000
    de-en: 10000
    en-ru: 10000
    ru-en: 10000
    en-ar: 10000
    ar-en: 10000
    en-vi: 10000
    vi-en: 10000
  human_target_only: true

annotate:
  annotator: gemma-4-E2B-it                    # cross-annotation — reuses v6b_gemma_2b matrices
  criterion: ot
  tau: 0.30
  top_k: 128
  lookahead_k: 0
  latency_bins: [low, low-medium, medium, medium-high, high]

sft_dataset:
  merge_small_chunks: true
  min_src_words: 4
  keep_collapsed_rows: false

train:
  num_epochs: 2
  per_device_batch_size: 2
  grad_accum_steps: 8
  learning_rate: 1.5e-5
  warmup_steps: 150
  eval_steps: 500
  save_steps: 500
  early_stopping_patience: 3
  bf16: true
  completion_only_loss: false

eval:
  test_sets:
    wmt15:    { de-en: 2169 }
    wmt22:    { de-en: 1979, en-de: 1904, ru-en: 2016, en-ru: 2037 }
    iwslt17:  { de-en: 1138, en-de: 1138, ar-en: 1460, en-ar: 1460 }
    iwslt15:  { vi-en: 1268, en-vi: 1268 }
  latencies: [low, low-medium, medium, medium-high, high]
  policy: check_argmax
  mode: streaming

plot:
  color: "#2c6fbb"
  marker: s
  label: Gemma-4B ← 2B annot
